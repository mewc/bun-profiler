# Every published port and the project name are overridable so that several
# checkouts (e.g. parallel Conductor workspaces) can run this stack at once.
# `dev/up.sh` derives them from CONDUCTOR_PORT; the defaults below are what you
# get when running `docker compose` directly.
#
# COMPOSE_PROJECT_NAME (env) overrides the `name` below.
name: bun-profiler-dev

services:
  app:
    build:
      context: ..
      dockerfile: dev/Dockerfile.app
    ports:
      - "${APP_PORT:-3002}:3000"
    environment:
      # The panel renders absolute links to the sibling services, so it needs
      # the host-side ports — inside the container it cannot know them.
      - PUBLIC_APP_URL=http://localhost:${APP_PORT:-3002}
      - PUBLIC_GRAFANA_URL=http://localhost:${GRAFANA_PORT:-3003}
      - PUBLIC_PYROSCOPE_URL=http://localhost:${PYROSCOPE_PORT:-4042}
      - PUBLIC_PROMETHEUS_URL=http://localhost:${PROMETHEUS_PORT:-9091}
      - PYROSCOPE_URL=${PYROSCOPE_TARGET_URL:-http://pyroscope:4040}
      - PYROSCOPE_FORMAT=${PYROSCOPE_FORMAT:-folded}
      - OTLP_PROFILES_URL=${OTLP_PROFILES_URL:-}
    volumes:
      - ..:/app
      - /app/node_modules # anonymous volume so container's node_modules isn't overwritten
    depends_on:
      # Only service_started: Pyroscope ships without a shell, so it can't carry
      # a healthcheck (see below). The profiler retries failed pushes anyway, so
      # a not-yet-ready Pyroscope costs at most the first window.
      - pyroscope
    restart: unless-stopped
    healthcheck:
      # The image has no curl or wget, but it does have bun.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/health'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pyroscope:
    image: grafana/pyroscope:latest
    ports:
      - "${PYROSCOPE_PORT:-4042}:4040"
    restart: unless-stopped
    # No healthcheck: the image is distroless (no shell, no curl/wget), so
    # there's no in-container command to run. dev/up.sh gates readiness on the
    # app instead, which is the thing that actually has to talk to Pyroscope.

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Overriding command drops the image defaults, so the config and data paths
    # have to be restated alongside the retention cap.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  alloy:
    image: grafana/alloy:latest
    profiles: ["alloy"]
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "${ALLOY_PORT:-12346}:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - pyroscope
      - pyroscope-secondary
    restart: unless-stopped

  pyroscope-secondary:
    image: grafana/pyroscope:latest
    profiles: ["alloy"]
    restart: unless-stopped

  fault-receiver:
    image: oven/bun:1.3
    profiles: ["faults"]
    working_dir: /app
    command: ["bun", "dev/faults/server.ts"]
    environment:
      - UPSTREAM_URL=http://pyroscope:4040
    ports:
      - "${FAULT_PORT:-4043}:4040"
    volumes:
      - ..:/app
      - /app/node_modules
    depends_on:
      - pyroscope
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["otlp"]
    command:
      - --config=/etc/otelcol-contrib/config.yaml
      - --feature-gates=service.profilesSupport
    ports:
      - "${OTLP_PORT:-4318}:4318"
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped
