name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun l

      - name: Build
        run: bun run build

      # Trusted publishing via OIDC — npm auto-detects the GitHub Actions
      # OIDC environment and requests a short-lived token. No secrets needed.
      # We set registry explicitly since setup-node's registry-url would
      # create an .npmrc with a placeholder token that blocks OIDC.
      - name: Publish
        run: |
          npm config set registry https://registry.npmjs.org/
          npm publish --provenance --access public
